# Hooks locais (opcional): pip install pre-commit && pre-commit install
# Barra segredos e problemas de lint ANTES do commit — o CI repete as mesmas checagens.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
