# Ambiente de PRODUÇÃO (deploy via Compose numa VPS).
# O GitHub Actions copia este arquivo para o servidor e executa:
#   IMAGE_TAG=sha-<commit> docker compose -f docker-compose.prod.yml up -d --wait
#
# Diferenças em relação ao docker-compose.yml:
#   - usa a imagem publicada no GHCR (não faz build no servidor);
#   - nenhuma credencial tem default: o .env do servidor é obrigatório;
#   - o Postgres não expõe porta para fora da rede do Compose.
name: devops-api

services:
  api:
    image: "${IMAGE:?defina IMAGE no .env, ex. ghcr.io/usuario/repo}:${IMAGE_TAG:-latest}"
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:?}
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
